# /run/edy-rdp holds the relay's AF_UNIX sockets and (in state/) session state.
# The socket dir stays root-owned and NOT group-writable so a group member
# cannot unlink the sockets; only the state subdir is writable by the relay.
# Type Path                 Mode UID       GID      Age Argument
d      /run/edy-rdp         0750 root      edy-rdp  -   -
d      /run/edy-rdp/state   0750 edy-relay edy-rdp  -   -
# per-connection FreeRDP3 bridge request/endpoint files, written by the relay uid
d      /run/edy-rdp/bridge  0750 edy-relay edy-rdp  -   -
# desktop-session-token challenge files: 0700 so ONLY the relay uid (and root) can
# reach them -> a browser can read a challenge only via a superuser Cockpit channel,
# which is the server-side proof of administrator mode (I4).
d      /run/edy-rdp/reg     0700 edy-relay edy-rdp  -   -
