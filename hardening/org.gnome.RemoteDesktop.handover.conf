<!-- grd handover D-Bus policy hardening (KNOWN_ISSUES I5).
     Install to /etc/dbus-1/system.d/ (overrides the shipped policy).

     I5 concern: a local user subscribing to grd's Handover-interface signals to
     steal the one-time (routing_token, username, password) that redirect a client.

     I29 addendum 3 (2026-09-01): the ORIGINAL, broadcast form of that exposure was
     the TakeClientReady signal, which stock grd emits with NO destination (a true
     broadcast any local user can subscribe to). The grd handover patch
     (source/patches/grd-handover-method-call.patch) ELIMINATES that broadcast:
     TakeClientReady is gone, replaced by a TakeClient method call. The remaining
     Handover signal, RedirectClient, is emitted DIRECTED to the handover daemon's
     own connection (destination=:1.NNNN) -- the bus delivers a directed signal only
     to that one connection, so other local users cannot receive it via a normal
     subscription (eavesdropping is not granted to non-root by the base policy).

     Therefore this drop-in NO LONGER denies receiving Handover signals: that deny
     protected nothing once the broadcast was removed, and it BROKE the legitimate
     handover -- the remote-login greeter runs as the systemd DynamicUser
     "gdm-greeter", whose uid is allocated per session (60595, 60597, 60598, ...) and
     has no stable passwd entry, so a <policy user="gdm-greeter"> rule can never
     resolve/match it and RedirectClient to the greeter was rejected
     ("Rejected receive message ... member=RedirectClient"), timing out the
     greeter->user-session handover so login never reached a desktop.

     We keep the send-side denies as defense-in-depth against a local user injecting
     into the handover/dispatcher. NOTE: the receive protection now depends on the grd
     patch being deployed; if grd is upgraded back to stock (which re-introduces the
     TakeClientReady broadcast), re-apply the patch, or re-add a receive filter that
     is compatible with the dynamic gdm-greeter uid. -->
<!DOCTYPE busconfig PUBLIC "-//freedesktop//DTD D-BUS Bus Configuration 1.0//EN"
 "http://www.freedesktop.org/standards/dbus/1.0/busconfig.dtd">
<busconfig>
  <policy context="default">
    <deny send_destination="org.gnome.RemoteDesktop.Rdp.Handover"/>
    <deny send_destination="org.gnome.RemoteDesktop.Rdp.Dispatcher"/>
  </policy>
</busconfig>
