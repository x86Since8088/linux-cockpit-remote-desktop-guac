# Installed by cockpit-guac-rdp as /etc/sysctl.d/90-edy-rdp-headless.conf.
# Do not edit here; re-run install.sh instead (it is overwritten on upgrade and
# removed by install.sh --uninstall).
#
# Reserve the per-user headless RDP session ports (33000 + uid - 1000, see
# headless/edy-rdp-headless-start.sh) from the kernel's ephemeral-port
# allocator. They lie inside net.ipv4.ip_local_port_range (32768-60999 by
# default), so without this an OUTBOUND connection can be handed one of them as
# its local port - and its replies then meet the edy_rdp_headless input rule
# that guards these ports (KNOWN_ISSUES I61). It also keeps a session's own
# grd listener from finding its port already taken by an outbound connection.
# Explicit bind() to a reserved port still works, so grd is unaffected.
# Applies to IPv4 and IPv6 alike (the IPv6 stack reads the same list).
#
# The kernel holds ONE list for this key and every writer replaces it whole:
# if this host reserves other ports too, put all of them in a single value in
# ONE file (install.sh --verify warns when another sysctl.d file sets this key).
#
# Applied at boot by systemd-sysctl, and at once by edy-rdp-firewall.service
# (start and reload).
net.ipv4.ip_local_reserved_ports = 33000-33999
